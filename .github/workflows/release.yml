name: Release

on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: write

env:
  # See ci.yml — `cyrius deps` populates ./lib/ from the version-pinned
  # snapshot, which then shadows the global snapshot on every build.
  # Intentional; silence the informational note across all release steps.
  CYRIUS_NO_WARN_SHADOW_LIB: "1"

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version
        run: |
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          TAG="${GITHUB_REF_NAME}"
          echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "tag ($TAG) is not semver x.y.z"; exit 1; }
          [ "$FILE_VERSION" = "$TAG" ] || {
            echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          grep -q '^version = "\${file:VERSION}"' cyrius.cyml || {
            echo "cyrius.cyml version must be \${file:VERSION}"; exit 1; }
          echo "Version verified: $TAG (cyrius.cyml pulls from VERSION via \${file:VERSION})"

      - name: Install Cyrius toolchain
        # Delegates to the upstream installer keyed on the cyrius.cyml
        # pin — lays out $HOME/.cyrius/{bin,lib} (binaries + stdlib
        # snapshot). See ci.yml for the rationale (replaces the pre-6.x
        # hand-rolled tarball extraction that copied `bin/cc5`, renamed
        # to `cycc` in the 6.x toolchain).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Sync stdlib
        # Cyrius does not auto-resolve stdlib (supply-chain safety). The
        # declared `[deps].stdlib` subset must be copied out of the pinned
        # snapshot into ./lib/ BEFORE `cyrius deps`, or the git-dep bundles'
        # own requirements have nothing to resolve against. ci.yml has always
        # done this; release.yml was missing it and only worked because
        # `cyrius deps` happened to find a pre-populated ./lib/ on the runner
        # in the pre-6.4 layout. Added at 1.6.5.
        run: cyrius lib sync

      - name: Resolve deps
        run: cyrius deps

      - name: Verify dep hashes
        run: |
          if [ -f cyrius.lock ]; then
            cyrius deps --verify
          else
            echo "::warning::cyrius.lock not committed — skipping hash verification"
          fi

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/nein
          echo "nein: $(wc -c < build/nein) bytes"

      - name: Regenerate dist bundles (consumer distribution artifacts)
        # Downstream consumers pull these via `[deps.nein] modules = [...]`:
        #   dist/nein.cyr      — stiva / aegis / sutra (bote/sigil-free core)
        #   dist/nein-mcp.cyr  — daimon ([lib.mcp]: + sign + mcp), since 1.6.2
        # A tagged release with either one missing or stale = broken
        # `cyrius deps` for those consumers. Through 1.6.4 this step built
        # only the default bundle, so a tag could ship a stale MCP bundle;
        # both are regenerated and gated as of 1.6.5. Mirrors bote / patra.
        #
        # No `|| true` — distlib failing is a release-blocking error, not a
        # warning. The old form masked it and let the weaker `test -s` check
        # pass on a stale-but-present file.
        run: |
          cyrius distlib
          cyrius distlib mcp
          for b in dist/nein.cyr dist/nein-mcp.cyr; do
            test -s "$b" || { echo "FAIL: $b not produced"; exit 1; }
            echo "$b: $(wc -l < "$b") lines, $(wc -c < "$b") bytes"
          done

      - name: Verify dist bundles match committed copies
        # Covers the `.deps` sidecars too, not just the `.cyr` bodies: a
        # sidecar names what a consumer must have in scope, and toolchain
        # 6.5.x rewrote both of them (dist/nein.deps went 3 -> 32 entries).
        # A stale sidecar breaks `cyrius deps` downstream just as hard as a
        # stale bundle, and is far easier to miss. Added at 1.6.5.
        run: |
          stale=0
          for b in dist/nein.cyr dist/nein-mcp.cyr dist/nein.deps dist/nein-mcp.deps; do
            if ! git diff --exit-code "$b"; then
              echo "FAIL: $b is stale."
              stale=1
            fi
          done
          if [ "$stale" -ne 0 ]; then
            echo "Regenerate via 'cyrius distlib' + 'cyrius distlib mcp' and commit before tagging."
            exit 1
          fi
          echo "dist bundles + .deps sidecars match the committed copies"

      - name: Smoke test
        run: |
          ./build/nein | tee /tmp/smoke
          grep -q "nein ready" /tmp/smoke || { echo "FAIL: smoke test"; exit 1; }

      - name: Archive
        # Both bundles ship as assets, each with its `.deps` sidecar — a
        # bundle downloaded without its sidecar doesn't tell the consumer
        # what it needs in scope. Through 1.6.4 only dist/nein.cyr was
        # attached, so daimon's bundle was release-invisible even though it
        # shipped at 1.6.2.
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          rm -f nein-*.tar.gz nein-*.cyr nein-*.deps
          git archive --format=tar.gz --prefix="nein-${TAG}/" -o "nein-${TAG}-src.tar.gz" HEAD
          cp build/nein             "nein-${TAG}-x86_64-linux"
          cp dist/nein.cyr          "nein-${TAG}.cyr"
          cp dist/nein.deps         "nein-${TAG}.deps"
          cp dist/nein-mcp.cyr      "nein-${TAG}-mcp.cyr"
          cp dist/nein-mcp.deps     "nein-${TAG}-mcp.deps"
          # No 2>/dev/null — a missing asset must fail the release, not
          # silently produce a short SHA256SUMS.
          sha256sum nein-*.tar.gz nein-*-x86_64-linux nein-*.cyr nein-*.deps > SHA256SUMS
          cat SHA256SUMS

      - name: Extract changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          awk "/^## \\[${TAG}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md > /tmp/body.md

      - uses: softprops/action-gh-release@v2
        with:
          name: "nein ${{ github.ref_name }}"
          body_path: /tmp/body.md
          prerelease: ${{ startsWith(github.ref_name, '0.') }}
          files: |
            nein-*.tar.gz
            nein-*-linux
            nein-*.cyr
            nein-*.deps
            cyrius.lock
            SHA256SUMS
